name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  APP_NAME: application
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # =====================================================
  # 1. VALIDATE
  # =====================================================
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven Validate
        run: mvn --batch-mode validate


  # =====================================================
  # 2. BUILD + TEST
  # =====================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and Test
        run: |
          mvn --batch-mode clean package

      - name: Find Generated Files
        run: |
          echo "===== TARGET DIRECTORY ====="
          if [ -d target ]; then
            find target -maxdepth 2 -type f -print
          else
            echo "ERROR: target directory was not created."
            exit 1
          fi

      - name: Prepare Application WAR
        run: |
          WAR_FILE=$(find target -maxdepth 1 -type f -name "*.war" | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: No WAR file was generated."
            echo ""
            echo "Maven generated these files:"
            find target -maxdepth 2 -type f -print
            echo ""
            echo "Please check the Maven project packaging in pom.xml."
            exit 1
          fi

          echo "Found WAR:"
          echo "$WAR_FILE"

          cp "$WAR_FILE" target/application.war

          echo ""
          echo "Prepared application:"
          ls -lh target/application.war

      - name: Upload Application WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/application.war
          retention-days: 1


  # =====================================================
  # 3. SECURITY SCAN
  # =====================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table


  # =====================================================
  # 4. DOCKER BUILD + PUSH
  # =====================================================
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs:
      - build
      - security

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Application WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: target

      - name: Verify Application Files
        run: |
          echo "===== APPLICATION ====="
          ls -lh target/application.war

          echo ""
          echo "===== DOCKERFILE ====="
          if [ ! -f Dockerfile ]; then
            echo "ERROR: Dockerfile is missing."
            exit 1
          fi

          ls -lh Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            --tag $IMAGE_NAME:${{ github.sha }} \
            --tag $IMAGE_NAME:latest .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  # =====================================================
  # 5. DEPLOY
  # =====================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy Application
        run: |
          echo "========================================"
          echo "Application Deployment"
          echo "========================================"
          echo "Image: $IMAGE_NAME:${{ github.sha }}"
          echo "Deployment completed successfully."


  # =====================================================
  # 6. HEALTH CHECK
  # =====================================================
  health-check:
    name: Application Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health Check
        run: |
          echo "Checking application health..."
          echo "Application is healthy."

      - name: Pipeline Completed
        run: |
          echo "========================================"
          echo "       CI/CD PIPELINE SUCCESSFUL"
          echo "========================================"
