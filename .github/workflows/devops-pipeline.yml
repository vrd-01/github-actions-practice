name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:

  # =========================
  # 1. VALIDATE
  # =========================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven Validate
        run: mvn --batch-mode validate


  # =========================
  # 2. BUILD & TEST
  # =========================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and Test
        run: |
          mvn --batch-mode clean package

      - name: Show Build Files
        run: |
          echo "===== BUILD OUTPUT ====="
          find target -maxdepth 2 -type f -print

      - name: Verify JAR
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No JAR file was generated."
            exit 1
          fi

          echo "JAR found:"
          ls -lh "$JAR_FILE"

          cp "$JAR_FILE" target/application.jar

          echo "Application JAR:"
          ls -lh target/application.jar

      - name: Upload Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/application.jar
          retention-days: 1


  # =========================
  # 3. SECURITY SCAN
  # =========================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: table


  # =========================
  # 4. DOCKER BUILD
  # =========================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - build
      - security

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Verify Application JAR
        run: |
          echo "===== APPLICATION JAR ====="
          ls -lh target/application.jar

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM eclipse-temurin:17-jre

          WORKDIR /app

          COPY target/application.jar /app/application.jar

          EXPOSE 8080

          ENTRYPOINT ["java", "-jar", "/app/application.jar"]
          EOF

      - name: Show Dockerfile
        run: |
          cat Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Name
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            -t "$IMAGE_NAME:latest" .

      - name: Push Docker Image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"


  # =========================
  # 5. DEPLOYMENT POC
  # =========================
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deployment
        run: |
          echo "======================================"
          echo "        DEPLOYMENT STAGE"
          echo "======================================"
          echo "Docker image successfully built and pushed."
          echo "Image: ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo ""
          echo "Deployment POC completed."


  # =========================
  # 6. HEALTH CHECK POC
  # =========================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health Check
        run: |
          echo "======================================"
          echo "          HEALTH CHECK"
          echo "======================================"
          echo "Pipeline deployment stage completed."
          echo "Health check POC: SUCCESS"

      - name: Pipeline Success
        run: |
          echo ""
          echo "======================================"
          echo "       CI/CD PIPELINE SUCCESSFUL"
          echo "======================================"
